<body><canvas id="oyun" width="1920" height="1080"></canvas><div id="test"></div>
<script>
// ===== KAFA FUTBOLU v2 - KARAKTER SANATI =====
// Her karakter (kafa + yaka) ifade başına bir kez yüksek çözünürlükte boyanır ve saklanır.
// Oyun sırasında sadece hazır görseller çizilir; hareket (eğilme, esneme, adım, şut) dönüşümlerle yapılır.

const SKINS = ['#f4c9a6', '#ecb48e', '#dc9d76', '#c5875f', '#a66d48', '#7f5136', '#f7d6ba', '#5f3b28'];
const HAIR_COLORS = ['#2a1912', '#3d2315', '#5b351f', '#7c4b2b', '#17140f', '#c69b55', '#e3c377', '#93401f', '#55555c', '#b9b9c2'];
const EYE_COLORS = ['#3f9bd1', '#3277c9', '#4f9a55', '#7a4a22', '#4a2f1a', '#5fa9b5', '#8a7436'];
const JERSEYS = [
  ['#e02b3f', '#ffffff'], ['#1f66d6', '#ffffff'], ['#f6bb0b', '#1b1b1b'], ['#1c9a4f', '#ffffff'],
  ['#7438d8', '#ffffff'], ['#f56f1c', '#ffffff'], ['#20212b', '#f6bb0b'], ['#10a3a3', '#ffffff'],
  ['#f1f1f1', '#e02b3f'], ['#c4184f', '#ffffff'], ['#0d2f78', '#f6bb0b'], ['#53fc18', '#10230a']
];
const BOOTS = ['#17171d', '#f2f2f2', '#e02b3f', '#1f66d6', '#f6bb0b', '#1c9a4f', '#f56f1c', '#7438d8', '#12b5c9'];
const SOLES = ['#53fc18', '#ffd23f', '#ff3d6e', '#3da5ff', '#ffffff', '#ff7a1a'];
const HAIR_STYLES = ['short', 'quiff', 'curly', 'mohawk', 'long', 'spiky', 'slick', 'fade', 'bald', 'afro', 'bun', 'short', 'quiff', 'spiky', 'fade', 'slick'];
const FACIAL = ['none', 'none', 'none', 'none', 'stubble', 'stubble', 'beard', 'goatee', 'mustache'];

function hashStr(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function seeded(seed) {
  let s = seed || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
function pick(r, arr) { return arr[Math.floor(r() * arr.length)]; }

function makeLook(username) {
  const r = seeded(hashStr(String(username).toLowerCase()));
  for (let i = 0; i < 3; i++) r();
  const jersey = pick(r, JERSEYS);
  const hair = pick(r, HAIR_STYLES);
  let facial = pick(r, FACIAL);
  if (hair === 'bald' && facial === 'none' && r() < 0.6) facial = 'beard';
  const look = {
    skin: pick(r, SKINS), hairColor: pick(r, HAIR_COLORS), hair, facial,
    eye: pick(r, EYE_COLORS),
    jersey: jersey[0], jerseyText: jersey[1],
    boot: pick(r, BOOTS), sole: pick(r, SOLES),
    headband: (hair === 'long' && r() < 0.55) || r() < 0.1,
    freckles: r() < 0.14, earring: r() < 0.12, scar: r() < 0.1,
    w: 0.96 + r() * 0.08,
    jaw: r(), nose: 0.9 + r() * 0.25, eyeS: 0.94 + r() * 0.16, browT: 0.85 + r() * 0.4,
    _sp: new Map()
  };
  if (look.boot === look.sole) look.sole = '#ffffff';
  look.team = lum(look.jersey) < 0.2 ? look.jerseyText : look.jersey;   // arayüzde kullanılan takım rengi
  return look;
}

// ---------- renk yardımcıları ----------
function hex2rgb(hex) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const n = parseInt(c, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function toHex(r, g, b) { return '#' + [r, g, b].map(v => clamp255(v).toString(16).padStart(2, '0')).join(''); }
function clamp255(v) { return Math.max(0, Math.min(255, Math.round(v))); }
function shade(hex, amt) {
  const [r, g, b] = hex2rgb(hex); const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return toHex((f - r) * p + r, (f - g) * p + g, (f - b) * p + b);
}
function mix(h1, h2, t) { const a = hex2rgb(h1), b = hex2rgb(h2); return toHex(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t); }
function rgba(hex, a) { const [r, g, b] = hex2rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function lum(hex) { const [r, g, b] = hex2rgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }

function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- geometri (fizik ile ortak) ----------
function charGeom(x, y, s, headScale = 1) {
  const R = 54 * s * headScale;
  const bootH = 30 * s;
  return { hx: x, hy: y - bootH - R * 0.9, R, bx: x, by: y - bootH * 0.5, br: 18 * s };
}

// ---------- hazır görsel (sprite) ayarları ----------
const RPX = 128;                       // 1 kafa birimi = 128 piksel
const SPR = { w: 3.7, h: 3.5, cx: 1.9, cy: 1.85 };

const P2 = (d) => new Path2D(d);
function HEADPATH(j) {
  return `M 0 -1 C .40 -1.01 .70 -.82 .72 -.42 C .73 -.3 .70 -.22 .675 -.13 C .66 -.02 .72 .12 .705 .30 C .69 .50 .64 .70 .56 .84 C .50 .95 .38 1 .24 1 C 0 1 ${-.30 - j * .07} .9 ${-.44 - j * .07} .63 C -.52 .48 -.56 .34 -.58 .2 C -.74 .2 -.89 0 -.90 -.3 C -.92 -.72 -.5 -1 0 -1 Z`;
}
// saç çizgisinin iç kenarı (enseden alına doğru)
const HAIRLINE = `L -.60 .12 C -.61 -.02 -.56 -.17 -.46 -.2 C -.40 -.22 -.36 -.14 -.335 -.02 L -.30 .13 L -.215 .10 C -.2 -.1 -.2 -.3 -.10 -.44 C .05 -.58 .35 -.63 .52 -.57 C .6 -.55 .66 -.51 .71 -.48 Z`;
const NAPE = `C -.5 -1.09 -.98 -.78 -.97 -.3 C -.97 -.05 -.88 .12 -.70 .20`;

function bumps(cx, cy, rx, ry, a0, a1, n, k = 1.2) {
  // a: derece cinsinden değil radyan; 0 = +x, artan açı yukarı/arka yöne
  let d = '', prev = null;
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * i / n;
    const x = cx + Math.cos(a) * rx, y = cy - Math.sin(a) * ry;
    if (prev) {
      const mx = (prev[0] + x) / 2, my = (prev[1] + y) / 2;
      d += ` Q ${(cx + (mx - cx) * k).toFixed(3)} ${(cy + (my - cy) * k).toFixed(3)} ${x.toFixed(3)} ${y.toFixed(3)}`;
    } else d += ` L ${x.toFixed(3)} ${y.toFixed(3)}`;
    prev = [x, y];
  }
  return d;
}

const HAIR = {
  short: { d: `M .71 -.48 C .77 -.62 .75 -.8 .62 -.93 C .45 -1.09 .2 -1.1 0 -1.09 ${NAPE} ${HAIRLINE}` },
  slick: { d: `M .71 -.48 C .75 -.6 .72 -.78 .6 -.9 C .44 -1.05 .2 -1.06 0 -1.05 C -.5 -1.05 -.95 -.76 -.94 -.3 C -.94 -.05 -.86 .12 -.70 .20 ${HAIRLINE}` },
  quiff: { d: `M .71 -.48 C .84 -.6 .95 -.86 .82 -1.12 C .66 -1.33 .3 -1.3 .05 -1.2 C -.45 -1.17 -.98 -.8 -.97 -.3 C -.97 -.05 -.88 .12 -.70 .20 ${HAIRLINE}` },
  spiky: { d: `M .71 -.48 L .88 -.82 L .70 -.86 L .80 -1.2 L .52 -1.02 L .47 -1.38 L .23 -1.1 L .05 -1.42 L -.12 -1.1 L -.37 -1.32 L -.43 -1.02 L -.72 -1.14 L -.69 -.86 C -.92 -.7 -.99 -.4 -.96 -.2 C -.94 0 -.86 .12 -.70 .20 ${HAIRLINE}` },
  curly: { d: `M .71 -.48 ${bumps(-.08, -.36, .86, .84, 0.12, Math.PI + 0.66, 11, 1.22)} L -.70 .20 ${HAIRLINE}` },

// ---- dışarıdan gelen olaylar ----
const pendingKicks = new Map();   // henüz 1 abonelik değerine ulaşmamış Kicks birikimi

// destek eklendikten sonra güç seviyesini ve güç haklarını günceller
function applySupport(t, before) {
  const pts = pointsOf(t.support), nt = tierOfPoints(pts);
  if (!(t instanceof Player)) { t.tier = Math.max(t.tier || 0, nt); return; }
  const inMatch = game.p.includes(t);
  const up = nt > t.tier && t.setTier(nt);
  if (up) { popup(t, `${TIERS[nt].icon} ${TIERS[nt].name.toLocaleUpperCase('tr')}!`, '#ffd23f'); SFX.power(); }
  const gained = chargesOfPoints(pts) - chargesOfPoints(before);
  if (gained > 0) { t.charges += gained; if (inMatch) popup(t, `⚡ +${gained} GÜÇ HAKKI`, '#8fe3ff'); SFX.power(); }
  else if (!up && inMatch && pts - before >= 1 - 1e-6) t.cheer = 1;   // en az 1 abonelik değerinde ek destek: bir alev şutu
  t.flash = 1;
}

function addEntry(name, kind, amount) {
  if (!name) name = 'Anonim';
  const key = name.toLowerCase();
  const target = (game.champ && game.champ.key === key) ? game.champ
    : game.p.find(p => p.key === key) || game.queue.find(e => e.name.toLowerCase() === key);
  // sahadaki / sıradaki kişi tekrar destek attı → gücüne eklenir
  if (target) {
    const before = pointsOf(target.support);
    addSupport(target, kind, amount);
    applySupport(target, before);
    return;
  }
  // yeni katılımcı: Kicks, 1 abonelik değerine ulaşana kadar birikir
  if (kind === 'kicks') {
    const tot = (pendingKicks.get(key) || 0) + amount;
    if (tot < CONFIG.kicksPerSub) { pendingKicks.set(key, tot); return; }
    pendingKicks.delete(key); amount = tot;
  }
  const entry = { name, tier: 0 }; addSupport(entry, kind, amount);
  entry.tier = tierOfPoints(pointsOf(entry.support));
  game.queue.push(entry);
  const pos = game.queue.length;
  const busy = game.state !== 'idle' && !(game.state === 'waiting' && pos === 1);
  if (busy) chatSay(siraMesaji());
  toast(`${name} ${busy ? `sırada: #${pos}` : 'sahaya çıkıyor!'}`, '#53fc18', kind === 'kicks' ? '💚' : kind === 'gift' ? '🎁' : '⭐');
}

function onSub(user) { addEntry(user, 'sub', 1); }
function onGift(user, count) { if (count > 0) addEntry(user, 'gift', count); }
function onKicks(user, amount) { if (amount > 0) addEntry(user, 'kicks', amount); }

// ---- chat'ten seçilen güçler (güç hakkı olan oyuncu maç sırasında yazar) ----
const goalGrow = { L: { t: 0, k: 0 }, R: { t: 0, k: 0 } };
const GOAL_GROW = 120;
function cbY(side) { return CB_Y - goalGrow[side].k * GOAL_GROW; }
const POWERS = {
  dondur: (p, o) => { o.frozen = 2.2; SFX.freeze(); popup(p, '❄️ DONDUR!', '#8fe3ff'); popup(o, '🥶 DONDU', '#8fe3ff'); const h = o.head(); fxRing(h.x, h.y, '#bdf2ff', 20, 140, 0.45, 9); burst(h.x, h.y, 18, { color: ['#bdf2ff', '#ffffff', '#7fdcff'], sp: 300, g: 100 }); },
  kale: (p, o) => { goalGrow[o.side].t = 9; SFX.power(); popup(p, '🥅 DEV KALE!', '#ffd23f'); const gx = o.side === 'L' ? GOAL_D / 2 : W - GOAL_D / 2; fxRing(gx, CB_Y, '#ffd23f', 30, 170, 0.5, 10); },
  alev: (p) => { p.fireReady = true; SFX.power(); popup(p, '🔥 ALEV HAZIR', '#ffb300'); },
  kucult: (p, o) => { o.shrink = 9; SFX.power(); popup(p, '🔻 KÜÇÜLT!', '#ff8fb0'); popup(o, '🔻 KÜÇÜLDÜ', '#ff8fb0'); const h = o.head(); fxRing(h.x, h.y, '#ff8fb0', 90, -70, 0.4, 8); }
};
const POWER_CMD = { '!dondur': 'dondur', '!don': 'dondur', '!buz': 'dondur', '!kale': 'kale', '!buyut': 'kale', '!devkale': 'kale', '!alev': 'alev', '!ates': 'alev', '!kucult': 'kucult', '!kucul': 'kucult', '!ufalt': 'kucult' };
const POWER_HINT = '!dondur  !kale  !alev  !küçült';
function usePower(p, id) {
  const o = game.p.find(q => q !== p);
  if (!o || p.charges <= 0 || p.powerCd > 0 || game.state !== 'playing') return false;
  p.charges--; p.powerCd = 1.2; p.flash = 1;
  POWERS[id](p, o);
  return true;
}

const cheerCd = new Map();
function onChat(user, text) {
  if (!text || text[0] !== '!') return;
  const key = (user || '').toLowerCase();
  const cmd = text.trim().split(/\s+/)[0].toLowerCase()
    .replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c');
  const p = game.p.find(pl => pl.key === key) || (game.champ && game.champ.key === key ? game.champ : null);
  const playing = game.state === 'playing';

  if (cmd === '!dans' && p) {
    if (game.state === 'waiting' && p === game.champ) { p.act = { type: 'dance', t: 0, dur: 3 }; return; }
    if ((game.state === 'goal' || game.state === 'end') && p.mood === 'happy') { p.act = { type: 'dance', t: 0, dur: 99 }; return; }
  }
  if (p && playing && game.p.includes(p) && POWER_CMD[cmd]) { usePower(p, POWER_CMD[cmd]); return; }
  // sadece maçta oynayan iki kişi: !zıpla ve !şut
  if (p && playing && game.p.includes(p)) {
    const t = now();
    if (cmd === '!zipla' || cmd === '!z' || cmd === '!jump') { doJump(p, true); return; }
    if (cmd === '!sut' || cmd === '!s' || cmd === '!vur') { p.forceKick = t + 900; return; }
  }
}

function doJump(p, forced) {
  if (p.onGround && p.stun <= 0 && p.frozen <= 0) {
    p.vy = -1050 * p.jumpMul; p.onGround = false;
    fxDust(p.x, p.y, 4, 150);
  }
}

function doKick(p, opp) {
  if (p.kickCd > 0 || p.stun > 0 || p.frozen > 0) return;
  p.kickT = 0.2; p.kickCd = 0.42;
  const f = p.foot();
  const dx = ball.x - f.x, dy = ball.y - f.y;
  const d = Math.hypot(dx, dy);
  if (d < 80 + BALL_R) {
    let special = false;
    if (p.fireReady) { special = true; p.fireReady = false; }
    if (special) {
      ball.vx = p.dir * 1850; ball.vy = -rand(180, 320); ball.fire = 1.4;
      SFX.fire(); shake = 8; popup(p, '🔥 ALEV ŞUTU!', '#ff7a1a');
      burst(ball.x, ball.y, 26, { color: ['#ff3d00', '#ffb300', '#ffd54f'], g: -100, sp: 460, size: 16, minSize: 9, kind: 'flame', life: 0.7 });
    } else {
      const chip = ball.y < p.y - 60 || Math.random() < 0.45;
      ball.vx = p.dir * rand(720, 980) + p.vx * 0.25;
      ball.vy = chip ? -rand(700, 950) : -rand(380, 620);
      SFX.kick();
    }
    ball.lastTouch = p;
    fxSparks(ball.x, ball.y, special ? 16 : 7, special ? '#ffd54f' : '#ffffff', special ? 800 : 480);
    fxRing(ball.x, ball.y, special ? '#ff9100' : '#ffffff', 8, special ? 120 : 48, special ? 0.4 : 0.25, special ? 9 : 5);
  }
}

function circleBall(cx, cy, cr, p, e, isHead) {
  const dx = ball.x - cx, dy = ball.y - cy;
  const d = Math.hypot(dx, dy), min = cr + BALL_R;
  if (d >= min || d === 0) return false;
  const nx = dx / d, ny = dy / d;
  ball.x = cx + nx * min; ball.y = cy + ny * min;
  const pvx = p ? p.vx : 0, pvy = p ? p.vy : 0;
  const rvx = ball.vx - pvx, rvy = ball.vy - pvy;
  const vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    ball.vx -= (1 + e) * vn * nx; ball.vy -= (1 + e) * vn * ny;
    if (p && isHead && ny < -0.3) { ball.vx += p.dir * 160; if (Math.abs(vn) > 250) { SFX.head(); fxRing(ball.x, ball.y, '#ffffff', 6, 36, 0.2, 4); } }
  }
  return true;
}

function ballRect(rx, ry, rw, rh, e = 0.7) {
  const cx = clamp(ball.x, rx, rx + rw), cy = clamp(ball.y, ry, ry + rh);
  const dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
  if (d >= BALL_R) return;
  let nx, ny;
  if (d === 0) { nx = 0; ny = ball.y < ry + rh / 2 ? -1 : 1; } else { nx = dx / d; ny = dy / d; }
  ball.x = cx + nx * BALL_R; ball.y = cy + ny * BALL_R;
  const vn = ball.vx * nx + ball.vy * ny;
  if (vn < 0) { ball.vx -= (1 + e) * vn * nx; ball.vy -= (1 + e) * vn * ny; }
}

// gol sonrası top filede sönümlenir
function settleBallInNet(dt) {
  const left = ball.x < W / 2;
  ball.vy += G_BALL * dt; ball.vx *= (1 - Math.min(1, 4 * dt));
  ball.x += ball.vx * dt; ball.y += ball.vy * dt; ball.rot += ball.vx / BALL_R * dt;
  if (ball.y > GROUND - BALL_R) { ball.y = GROUND - BALL_R; ball.vy = ball.vy > 120 ? -ball.vy * 0.45 : 0; ball.vx *= 0.9; }
  const cbn = cbY(left ? 'L' : 'R');
  if (ball.y < cbn + BALL_R) { ball.y = cbn + BALL_R; ball.vy = Math.abs(ball.vy) * 0.4; }
  const lo = left ? BALL_R + 6 : W - GOAL_D + BALL_R, hi = left ? GOAL_D - BALL_R : W - BALL_R - 6;
  if (ball.x < lo) { ball.x = lo; ball.vx = Math.abs(ball.vx) * 0.25; }
  if (ball.x > hi) { ball.x = hi; ball.vx = -Math.abs(ball.vx) * 0.25; }
}

function updateBall(dt, scoring) {
  const g = ball.fire > 0 ? G_BALL * 0.25 : G_BALL;
  const maxV = ball.fire > 0 ? 1950 : 1050;
  const sp0 = Math.hypot(ball.vx, ball.vy);
  if (sp0 > maxV) { ball.vx *= maxV / sp0; ball.vy *= maxV / sp0; }
  ball.vy += g * dt;
  ball.vx *= (1 - 0.15 * dt);
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  ball.rot += ball.vx / BALL_R * dt;
  if (ball.fire > 0) {
    ball.fire -= dt;
    particles.push({ x: ball.x + rand(-10, 10), y: ball.y + rand(-10, 10), vx: -ball.vx * 0.1, vy: rand(-80, -20), life: 0.5, max: 0.5, size: rand(10, 19), color: ['#ff3d00', '#ff9100', '#ffd54f'][Math.floor(Math.random() * 3)], g: -200, kind: 'flame' });
  }
  // zemin
  if (ball.y > GROUND - BALL_R) {
    ball.y = GROUND - BALL_R;
    if (ball.vy > 120) ball.vy = -ball.vy * 0.68; else ball.vy = 0;
    ball.vx *= 0.985;
  }
  if (ball.y < CEIL + BALL_R) { ball.y = CEIL + BALL_R; ball.vy = Math.abs(ball.vy) * 0.7; }
  // arka duvarlar
  if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx) * 0.5; }
  if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx) * 0.5; }
  // üst direkler ve kale tavanı
  const cL = cbY('L'), cR = cbY('R');
  ballRect(0, cL - CB_T, GOAL_D + 10, CB_T);
  ballRect(W - GOAL_D - 10, cR - CB_T, GOAL_D + 10, CB_T);
  // tribün sınırı (kale üstü) — top kalenin üstünden dışarı çıkmasın
  if (ball.y < cL - CB_T && ball.x < GOAL_D + 10 + BALL_R) {
    if (ball.x < GOAL_D + 10) { ball.x = GOAL_D + 10 + BALL_R; ball.vx = Math.abs(ball.vx) * 0.6; }
  }
  if (ball.y < cR - CB_T && ball.x > W - GOAL_D - 10 - BALL_R) {
    if (ball.x > W - GOAL_D - 10) { ball.x = W - GOAL_D - 10 - BALL_R; ball.vx = -Math.abs(ball.vx) * 0.6; }
  }

  // gol kontrolü
  if (ball.y > cL && ball.x + BALL_R < GOAL_D) return 'L';     // sol kaleye gol
  if (ball.y > cR && ball.x - BALL_R > W - GOAL_D) return 'R'; // sağ kaleye gol
  // top takıldıysa
  const sp = Math.abs(ball.vx) + Math.abs(ball.vy);
  ball.still = sp < 40 ? ball.still + dt : 0;
  const nearGoal = (ball.x < GOAL_D + 170 || ball.x > W - GOAL_D - 170) && ball.y > GROUND - 220;
  ball.corner = nearGoal ? (ball.corner || 0) + dt : 0;
  if (ball.still > 4 || ball.corner > 4) { ball.corner = 0; resetBall(); toast('Top sıkıştı, ortadan yeniden atıldı', '#ffffff', '🔄'); }
  return null;
}

function updatePlayer(p, opp, dt, mode) {
  p.t += dt;
  p.flash = Math.max(0, p.flash - dt);
  for (const pp of p.popups) pp.t += dt;
  p.popups = p.popups.filter(pp => pp.t < pp.life);
  if (p.kickT > 0) p.kickT -= dt;
  if (p.kickCd > 0) p.kickCd -= dt;
  if (p.stun > 0) p.stun -= dt;
  if (p.frozen > 0) p.frozen -= dt;
  if (p.powerCd > 0) p.powerCd -= dt;
  if (p.shrink > 0) p.shrink -= dt;
  p.shrinkK += ((p.shrink > 0 ? 1 : 0) - p.shrinkK) * Math.min(1, dt * 8);

  // spawn düşüşü
  if (p.spawning) {
    p.vy += G_PLAYER * dt; p.y += p.vy * dt;
    if (p.y >= GROUND) {
      p.y = GROUND; p.vy = 0; p.spawning = false; p.onGround = true; shake = 8;
      fxRing(p.x, GROUND - 3, '#ffffff', 24, 170, 0.5, 9); particles[particles.length - 1].flat = 0.26;
      fxRing(p.x, GROUND - 3, p.look.team, 12, 110, 0.45, 7); particles[particles.length - 1].flat = 0.26;
      fxDust(p.x, GROUND, 10, 340); fxSparks(p.x, GROUND - 12, 12, mix(p.look.team, '#ffffff', 0.5), 620);
    }
    return;
  }
  if (p.leaving) {
    p.vx = (p.x < W / 2 ? -1 : 1) * 400; p.x += p.vx * dt; p.alpha -= dt * 0.7;
    if (p.alpha <= 0) p.gone = true;
    if (Math.random() < 0.25) fxDust(p.x, GROUND, 1, 60);
    return;
  }

  let move = 0;
  const t = now();
  const canAct = p.stun <= 0 && p.frozen <= 0;

  if (mode === 'play' || mode === 'solo') {
    // özel güçler
    if (p.cheer >= 1) { p.cheer = 0; p.fireReady = true; popup(p, '🔥 ALEV HAZIR', '#ffb300'); toast(`${p.name} için ALEV ATIŞI hazır!`, '#ff6b35', '🔥'); SFX.power(); }
    if (p.tier >= 3 && !p.fireReady) { p.specialT += dt; if (p.specialT > 10) { p.specialT = 0; p.fireReady = true; } }
    if (p.tier >= 4 && opp && mode === 'play') {
      p.freezeT -= dt;
      if (p.freezeT <= 0) { p.freezeT = 15; opp.frozen = 1.6; SFX.freeze(); popup(p, '❄️ DONDURDU!', '#7fdcff'); popup(opp, '🥶 DONDU', '#7fdcff'); toast(`${p.name}, ${opp.name} adlı rakibi dondurdu!`, '#7fdcff', '❄️'); burst(opp.head().x, opp.head().y, 18, { color: ['#bdf2ff', '#ffffff', '#7fdcff'], sp: 300, g: 100 }); fxRing(opp.head().x, opp.head().y, '#bdf2ff', 20, 130, 0.45, 8); }
    }

    // yapay zekâ
    p.aiT -= dt;
    if (p.aiT <= 0) {
      p.aiT = rand(0.08, 0.18);
      p.aiErr = rand(-30, 30);
      const bx = ball.x + ball.vx * 0.18;
      const behind = (bx - p.x) * p.dir < -15;
      const ownGoalX = p.side === 'L' ? 0 : W;
      const danger = (ball.vx * -p.dir) > 300 && Math.abs(ball.x - ownGoalX) < W * 0.55;
      const myDist = Math.abs(ball.x - p.x), oppDist = opp ? Math.abs(ball.x - opp.x) : 9999;
      const onMySide = (ball.x - W / 2) * p.dir < 0;
      const guardX = ownGoalX + p.dir * (GOAL_D + 110);
      if (danger && behind) p.target = bx - p.dir * 90;
      else if (behind) p.target = bx - p.dir * 75;
      else if (opp && oppDist < myDist - 40 && Math.abs(ball.x - ownGoalX) < W * 0.6) p.target = guardX + (bx - guardX) * 0.35; // kaleye dön, savun
      else p.target = bx - p.dir * 38;
      if (mode === 'solo') p.target = bx - p.dir * 40;
      p.target += p.aiErr;
      // zıplama kararı
      const h = p.head();
      if (Math.abs(ball.x - p.x) < 150 && ball.y < h.y - 10 && ball.y > h.y - 260 && ball.vy > -300 && Math.random() < 0.55) doJump(p);
    }
    if (canAct) {
      const dx = p.target - p.x;
      move = Math.abs(dx) > 14 ? Math.sign(dx) : 0;
      if (p.cmd.until > t) move = p.cmd.move;
      // şut kararı
      const f = p.foot();
      const close = Math.hypot(ball.x - f.x, ball.y - f.y) < 80 + BALL_R;
      const ahead = (ball.x - p.x) * p.dir > 0;
      if (close && ahead && (Math.random() < 0.06 || p.fireReady)) doKick(p, opp);
      if (p.forceKick && p.forceKick > t && close) { doKick(p, opp); p.forceKick = 0; }
    }
  } else if (mode === 'roam' && canAct) {
    move = roam(p, dt);
  } else if (mode === 'celebrate') {
    move = celebrate(p, dt);
  }

  const speed = (p.walkSpeed || 520) * p.speedMul;
  const targetVx = move * speed;
  p.vx += (targetVx - p.vx) * Math.min(1, dt * 14);
  if (!canAct) p.vx *= 0.8;
  p.vy += G_PLAYER * dt;
  p.x += p.vx * dt; p.y += p.vy * dt;
  if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; p.onGround = true; } else p.onGround = false;
  p.x = clamp(p.x, GOAL_D * 0.55, W - GOAL_D * 0.55);
}

function collidePlayers(a, b) {
  if (!a || !b || a.spawning || b.spawning) return;
  const min = (a.head().r + b.head().r) * 0.9;
  const lo = GOAL_D * 0.55, hi = W - GOAL_D * 0.55;
  for (let it = 0; it < 2; it++) {
    const dx = b.x - a.x;
    if (Math.abs(dx) >= min || Math.abs(a.y - b.y) >= 170) return;
    const sgn = Math.sign(dx || (a.side === 'L' ? 1 : -1));
    const push = (min - Math.abs(dx)) / 2 * sgn;
    a.x = clamp(a.x - push, lo, hi); b.x = clamp(b.x + push, lo, hi);
    // biri duvara/kaleye sıkıştıysa diğerini tamamen it
    const rest = min - Math.abs(b.x - a.x);
    if (rest > 0) {
      if (a.x === lo || a.x === hi) b.x = clamp(a.x + sgn * min, lo, hi);
      else if (b.x === lo || b.x === hi) a.x = clamp(b.x - sgn * min, lo, hi);
    }
  }
}

function ballVsPlayers(players) {
  for (const p of players) {
    if (!p || p.spawning || p.leaving) continue;
    const h = p.head(), b = p.body();
    const hit = circleBall(h.x, h.y, h.r, p, 0.55, true) | circleBall(b.x, b.y, b.r, p, 0.4, false);
    if (hit) {
      if (ball.fire > 0 && ball.lastTouch && ball.lastTouch !== p) {
        p.stun = 1.3; ball.fire = 0; shake = 8;
        burst(h.x, h.y - h.r * 0.6, 7, { kind: 'star', g: 120, sp: 260, size: 6, minSize: 4, life: 0.9 }); fxRing(h.x, h.y, '#ffd54f', 20, 120, 0.4, 9);
        toast(`${p.name} alev topuyla sersemledi!`, '#ff6b35', '😵');
        popup(p, '😵 SERSEMLEDİ', '#ffd23f');
      }
      ball.lastTouch = p;
    }
  }
}

// ---------------- boşta / sevinç animasyonları ----------------
const ROAM_ACTS = ['walk', 'juggle', 'walk', 'sit', 'hop', 'spin', 'juggle', 'kickup', 'walk', 'dance', 'look'];
function pickAct(p, list) {
  let a; do { a = list[Math.floor(Math.random() * list.length)]; } while (a === p.lastAct && list.length > 1);
  p.lastAct = a;
  const durs = { walk: 9, juggle: rand(4, 6.5), sit: rand(3.5, 6), hop: 2.2, spin: 1.6, kickup: 3.2, dance: 3, look: 2.4 };
  p.act = { type: a, t: 0, dur: durs[a], tx: rand(W * 0.15, W * 0.85), n: 0 };
}
function resetPose(p) { p.act = null; p.sit = 0; p.rot = 0; p.face = null; p.toy = null; p.walkSpeed = 0; }

function roam(p, dt) {
  if (!p.act || p.act.t >= p.act.dur) pickAct(p, ROAM_ACTS);
  const A = p.act; A.t += dt;
  p.walkSpeed = 0; p.face = null;
  p.sit += ((A.type === 'sit' ? 1 : 0) - (p.sit || 0)) * Math.min(1, dt * 6);
  p.toy = null;
  switch (A.type) {
    case 'walk': {
      const dx = A.tx - p.x;
      if (Math.abs(dx) < 12) { A.t = A.dur; return 0; }
      p.walkSpeed = 240; p.face = Math.sign(dx);
      return Math.sign(dx);
    }
    case 'juggle': {
      // kafayla top sektirme
      const h = p.head();
      const ph = (A.t * 1.5) % 1;
      p.toy = { x: h.x + Math.sin(A.t * 3) * 6, y: h.y - h.r - 14 - Math.sin(ph * Math.PI) * 150, rot: A.t * 6 };
      if (ph < 0.08 && p.onGround && Math.random() < 0.3) p.vy = -250;
      return 0;
    }
    case 'kickup': {
      // ayakla havaya at, kafayla karşıla
      const f = p.foot(), h = p.head();
      const ph = Math.min(1, A.t / 1.6);
      if (A.t < 1.6) p.toy = { x: f.x + (h.x - f.x) * ph, y: f.y - Math.sin(ph * Math.PI) * 300 - (f.y - h.y + h.r) * ph, rot: A.t * 8 };
      else { const q = ((A.t - 1.6) * 1.5) % 1; p.toy = { x: h.x, y: h.y - h.r - 14 - Math.sin(q * Math.PI) * 120, rot: A.t * 6 }; }
      if (A.t < 0.2) p.kickT = 0.2;
      return 0;
    }
    case 'hop':
      if (p.onGround && A.t < A.dur - 0.4) p.vy = -560;
      return 0;
    case 'spin':
      p.face = Math.floor(A.t / 0.14) % 2 ? -1 : 1;
      return 0;
    case 'dance':
      p.face = Math.floor(A.t / 0.35) % 2 ? -1 : 1;
      if (p.onGround && Math.random() < 0.08) p.vy = -420;
      if (Math.random() < 0.02) popup(p, ['🎵', '🎶', '🕺', '💃'][Math.floor(Math.random() * 4)], '#ffffff');
      return 0;
    case 'look':
      p.face = A.t < A.dur / 2 ? -1 : 1;
      return 0;
    case 'sit':
      if (A.t > 2.5 && Math.random() < 0.012) popup(p, '💤', '#cfe6ff');
      return 0;
  }
  return 0;
}

const CELEBS = ['flip', 'spin', 'slide', 'dance', 'jumps'];
function celebrate(p, dt) {
  if (!p.act || !CELEBS.includes(p.act.type)) {
    const type = CELEBS[Math.floor(Math.random() * CELEBS.length)];
    p.act = { type, t: 0, dur: 99, done: false, sx: p.x < W / 2 ? 1 : -1 };
    popup(p, ['🔥', '😎', '💪', '🚀', '⚡', '🥳'][Math.floor(Math.random() * 6)], '#ffffff');
  }
  const A = p.act; A.t += dt; p.walkSpeed = 0; p.face = null;
  switch (A.type) {
    case 'flip':   // ters takla
      if (p.onGround && !A.done) { p.vy = -1100; A.done = true; A.t0 = A.t; }
      if (A.done && !p.onGround) p.rot = -p.dir * Math.min(1, (A.t - A.t0) / 0.75) * Math.PI * 2;
      if (A.done && p.onGround && A.t - A.t0 > 0.3) { p.rot = 0; A.done = false; }
      return 0;
    case 'spin':
      p.face = Math.floor(A.t / 0.1) % 2 ? -1 : 1;
      if (p.onGround && Math.random() < 0.05) p.vy = -500;
      return 0;
    case 'slide':  // diz üstü kayma
      if (A.t < 0.9) { p.walkSpeed = 700; p.rot = -A.sx * 0.35; p.face = A.sx; return A.sx; }
      p.rot *= 0.9; return 0;
    case 'dance':
      p.face = Math.floor(A.t / 0.3) % 2 ? -1 : 1;
      if (p.onGround && Math.random() < 0.1) p.vy = -450;
      return 0;
    default:       // zıplama
      if (p.onGround && Math.random() < 0.06) p.vy = -850;
      return 0;
  }
}

// ---------------- akış ----------------
let shake = 0;

function setState(s) { game.state = s; game.stateT = 0; }

function startMatch() {
  const champ = game.champ;
  const entry = game.queue.shift();
  const side = champ.side === 'L' ? 'R' : 'L';
  const ch = spawnPlayer(entry, side);
  game.p = side === 'R' ? [champ, ch] : [ch, champ];
  champ.score = 0; ch.score = 0; champ.crown = !!champ.crown;
  champ.cheer = 0; ch.cheer = 0; champ.fireReady = false; champ.mood = 'normal';
  resetPose(champ); resetPose(ch);
  for (const pl of [champ, ch]) { pl.charges = chargesOfPoints(pointsOf(pl.support)); pl.shrink = 0; pl.powerCd = 0; }
  goalGrow.L.t = goalGrow.R.t = 0;
  game.champ = null; game.golden = false;
  game.time = CONFIG.matchSeconds;
  setState('countdown');
  toast(`MAÇ: ${game.p[0].name} vs ${game.p[1].name}`, '#ffffff', '⚔️');
  const guclu = game.p.filter(pl => pl.charges > 0).map(pl => `${pl.name} (${pl.charges})`).join(', ');
  chatSay(`⚔️ Kafa Futbolu maçı başladı: ${game.p[0].name} vs ${game.p[1].name}${game.queue.length ? ` | Sıradaki: ${game.queue[0].name}` : ''}${guclu ? ` | Güç hakkı: ${guclu} → ${POWER_HINT}` : ''}`);
  for (const pl of game.p) if (pl.tier) popup(pl, `${TIERS[pl.tier].icon} ${TIERS[pl.tier].name.toLocaleUpperCase('tr')}`, '#ffd23f');
}

function resetPositions() {
  for (const p of game.p) {
    p.x = p.side === 'L' ? W * 0.3 : W * 0.7; p.y = GROUND; p.vx = 0; p.vy = 0;
    p.stun = 0; p.frozen = 0;
  }
  resetBall();
}

function endMatch() {
  const [a, b] = game.p;
  if (a.score === b.score && !game.golden) {
    game.golden = true; game.time = CONFIG.goldenGoalSeconds;
    game.banner = { text: 'ALTIN GOL!', sub: 'İlk golü atan kazanır', t: 0, life: 2.5, color: '#ffffff', icon: 'bolt' };
    SFX.whistle();
    return;
  }
  SFX.whistle();
  a.fireReady = b.fireReady = false;
  if (a.score === b.score) {
    game.winner = null;
    game.banner = { text: 'BERABERE!', sub: 'İki oyuncu da sahadan çıkıyor', t: 0, life: 4, color: '#ffffff' };
    chatSay(`🤝 ${a.name} ile ${b.name} berabere kaldı (${a.score}-${b.score}).${game.queue.length ? ` Sıradaki: ${game.queue[0].name}` : ''}`);
  } else {
    const w = a.score > b.score ? a : b, l = w === a ? b : a;
    game.winner = w; w.mood = 'happy'; w.crown = true; l.mood = 'sad';
    chatSay(`🏆 ${w.name} kazandı! (${a.score}-${b.score}) ${game.queue.length ? `Sıradaki rakip: ${game.queue[0].name}` : 'Yeni rakip bekleniyor: abone ol ya da Kicks gönder!'}`);
    game.banner = { text: 'KAZANAN', sub: w.name, t: 0, life: 5, color: '#ffffff', who: w, icon: 'trophy' };
    fxConfetti(w.head().x, w.head().y - 60, 150, 780, 340);
    SFX.goal();
  }
  setState('end');
}

function update(dt) {
  game.stateT += dt;
  const fieldWant = ['countdown', 'playing', 'goal', 'end'].includes(game.state) ? 1 : 0;
  game.fieldA = (game.fieldA || 0) + (fieldWant - (game.fieldA || 0)) * Math.min(1, dt * 3.5);
  shake = Math.max(0, shake - dt * 40);
  for (const sd of ['L', 'R']) { const gg = goalGrow[sd]; if (gg.t > 0) gg.t -= dt; gg.k += ((gg.t > 0 ? 1 : 0) - gg.k) * Math.min(1, dt * 6); }
  if (game.state === 'end' || game.state === 'idle' || game.state === 'waiting') goalGrow.L.t = goalGrow.R.t = 0;
  for (const t of toasts) t.t += dt;
  while (toasts.length && toasts[0].t > toasts[0].life) toasts.shift();
  if (game.banner) { game.banner.t += dt; if (game.banner.t > game.banner.life) game.banner = null; }
  updateParticles(dt);
  for (const l of game.leavers) updatePlayer(l, null, dt, 'leave');
  game.leavers = game.leavers.filter(l => !l.gone);

  switch (game.state) {
    case 'idle': {
      updateBall(dt, false);
      if (game.queue.length) {
        game.champ = spawnPlayer(game.queue.shift(), 'L');
        game.champ.waitUntil = Date.now() + CONFIG.waitMinutes * 60000;
        resetBall(W / 2);
        setState('waiting');
      }
      break;
    }
    case 'waiting': {
      const c = game.champ;
      updatePlayer(c, null, dt, 'roam');
      if (game.queue.length && !c.spawning && game.stateT > 1) { startMatch(); break; }
      if ((CONFIG.waitMinutes > 0 && Date.now() > c.waitUntil) || c.forceLeave) {
        toast(`${c.name} için süre doldu, rakip çıkmadı`, '#aaaaaa', '⌛');
        c.leaving = true; game.leavers.push(c); game.champ = null; setState('idle');
      }
      break;
    }
    case 'countdown': {
      for (const p of game.p) updatePlayer(p, null, dt, 'idle');
      if (game.stateT < 0.05) resetBall();
      const n = 3 - Math.floor(game.stateT);
      if (n !== game._lastCount && n > 0 && !game.p.some(p => p.spawning)) { game._lastCount = n; SFX.count(); }
      if (game.p.some(p => p.spawning)) game.stateT = Math.min(game.stateT, 0.01);
      if (game.stateT > 3.6) {
        resetPositions(); SFX.whistle(); game._lastCount = null; setState('playing');
        for (const pl of game.p) if (pl.charges > 0) popup(pl, `⚡ ${pl.charges} GÜÇ HAKKI`, '#8fe3ff');
      }
      break;
    }
    case 'playing': {
      game.time -= dt;
      const [a, b] = game.p;
      updatePlayer(a, b, dt, 'play'); updatePlayer(b, a, dt, 'play');
      collidePlayers(a, b);
      ballVsPlayers(game.p);
      const g = updateBall(dt, true);
      if (g) {
        const scorer = g === 'L' ? game.p.find(p => p.side === 'R') : game.p.find(p => p.side === 'L');
        scorer.score++; game.lastScorer = scorer; scorer.mood = 'happy';
        const other = scorer === a ? b : a; other.mood = 'sad';
        game.banner = { text: 'GOOOL!', sub: scorer.name, t: 0, life: 2.2, color: '#ffffff', who: scorer };
        fxConfetti(ball.x, ball.y - 40, 110, 820, 260);
        fxRing(ball.x, ball.y, '#ffffff', 20, 240, 0.6, 12); fxRing(ball.x, ball.y, scorer.look.team, 10, 150, 0.5, 9);
        fxSparks(ball.x, ball.y, 14, '#ffffff', 700);
        netHit(g, ball.y); slowT = 0.4;
        ball.vx *= 0.35; ball.fire = 0;
        shake = 10; SFX.goal();
        if (game.golden) { endMatch(); break; }
        setState('goal');
        break;
      }
      if (game.time <= 0) { game.time = 0; endMatch(); }
      break;
    }
    case 'goal': {
      settleBallInNet(dt);
      for (const p of game.p) updatePlayer(p, null, dt, p.mood === 'happy' ? 'celebrate' : 'idle');
      if (game.stateT > 2.3) {
        for (const p of game.p) { p.mood = 'normal'; resetPose(p); }
        ball.hidden = false; resetPositions(); SFX.whistle(); setState('playing');
      }
      break;
    }
    case 'end': {
      if ((ball.x < GOAL_D && ball.y > cbY('L')) || (ball.x > W - GOAL_D && ball.y > cbY('R'))) settleBallInNet(dt); else { ballVsPlayers(game.p); updateBall(dt, false); }
      for (const p of game.p) updatePlayer(p, null, dt, p === game.winner ? 'celebrate' : 'idle');
      if (game.stateT > 5.5) {
        ball.hidden = false;
        if (game.winner) {
          const w = game.winner, l = game.p.find(p => p !== w);
          l.leaving = true; game.leavers.push(l);
          resetPose(w); w.mood = 'normal'; w.score = 0; w.fireReady = false; w.cheer = 0;
          w.waitUntil = Date.now() + CONFIG.waitMinutes * 60000;
          w.y = Math.min(w.y, GROUND); w.vy = 0;
          game.champ = w; game.p = []; resetBall(); setState('waiting');
          toast(`${w.name} sahada! Yeni rakip bekleniyor`, '#ffd23f', '👑');
        } else {
          for (const p of game.p) { p.leaving = true; game.leavers.push(p); }
          game.p = []; resetBall(); setState('idle');
        }
        game.winner = null;
      }
      break;
    }
  }
}

const FONT = 'KF, "Segoe UI", Arial, sans-serif';
let FRAME_DT = 0.016, TIME = 0, slowT = 0;
const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeOutBack = (t) => { t = clamp(t, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

// ---------- yazı ----------
function setFont(size, italic) { ctx.font = `${italic ? 'italic ' : ''}700 ${size}px ${FONT}`; }
function txt(text, x, y, size, o = {}) {
  setFont(size, o.italic);
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const sw = o.sw ?? Math.max(6, size / 3.6);
  if (sw > 0) { ctx.strokeStyle = o.stroke || 'rgba(8,10,16,0.94)'; ctx.lineWidth = sw; ctx.strokeText(text, x, y); }
  ctx.fillStyle = o.color || '#ffffff'; ctx.fillText(text, x, y);
}
const EMOJI_ICON = { '🥅': 'goal', '🔻': 'shrink', '⭐': 'star', '🎁': 'gift', '💚': 'kicks', '🔥': 'fire', '⚡': 'bolt', '👑': 'crown', '❄️': 'snow', '❄': 'snow', '🥶': 'snow', '🎈': 'balloon', '😵': 'star', '⏱️': 'clock', '⏱': 'clock', '🎵': 'note', '🎶': 'note', '💤': 'zzz' };
const EMOJI_RE = /(🥅|🔻|⭐|🎁|💚|🔥|⚡|👑|❄️|❄|🥶|🎈|😵|⏱️|⏱|🎵|🎶|💤)/;
function richParts(text) {
  return String(text).split(EMOJI_RE).map(s => EMOJI_ICON[s] ? { icon: EMOJI_ICON[s] } : { text: s.trim() }).filter(p => p.icon || p.text);
}
// simge + yazı karışık satır; ortalanmış çizer, genişliği döndürür
function rich(text, x, y, size, o = {}) {
  const parts = richParts(text);
  setFont(size, o.italic);
  const gap = size * 0.24, iw = size * 1.08;
  let w = 0; parts.forEach((p, i) => { p.w = p.icon ? iw : ctx.measureText(p.text).width; w += p.w + (i ? gap : 0); });
  if (o.measure) return w;
  let cx = x - w / 2;
  for (const p of parts) {
    if (p.icon) drawIcon(p.icon, cx + iw / 2, y - size * 0.03, size * 1.22);
    else txt(p.text, cx, y, size, { ...o, align: 'left' });
    cx += p.w + gap;
  }
  return w;
}

const GLOWS = {};
function glowSprite(color) {
  if (GLOWS[color]) return GLOWS[color];
  const cvs = document.createElement('canvas'); cvs.width = cvs.height = 128;
  const c = cvs.getContext('2d'); const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, rgba(color, 1)); g.addColorStop(0.35, rgba(color, 0.55)); g.addColorStop(1, rgba(color, 0));
  c.fillStyle = g; c.fillRect(0, 0, 128, 128);
  return (GLOWS[color] = cvs);
}

// ---------- efekt yardımcıları ----------
function fxRing(x, y, color = '#ffffff', size = 10, grow = 90, life = 0.45, lw = 7) {

}
function fxDust(x, y, n = 6, spread = 220) {

    const d = i % 2 ? 1 : -1;
    particles.push({ x: x + rand(-10, 10), y: y - rand(0, 8), vx: d * rand(40, spread), vy: -rand(10, 70), life: rand(0.35, 0.7), max: 0.7, size: rand(14, 26), color: '#e9efe6', g: -40, kind: 'smoke', rot: 0, vr: 0 });
  }
}
function fxSparks(x, y, n = 8, color = '#fff6c2', sp = 520) {

    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.18, 0.38), max: 0.38, size: rand(3, 5), color, g: 900, kind: 'spark', rot: 0, vr: 0 });
  }
}
function fxConfetti(x, y, n = 90, sp = 800, up = 250) {
  const cols = ['#53fc18', '#ffd23f', '#ff3d6e', '#3da5ff', '#ffffff', '#b06bff'];
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(120, sp);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - up, life: rand(1.2, 2.8), max: 2.8, size: rand(6, 11), color: cols[i % cols.length], g: 520, kind: 'confetti', rot: rand(0, 6), vr: rand(-12, 12), drag: 1 });

}
function drawParticles() {
  for (const p of particles) {

        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.rot * 2.3 + p.size));
        ctx.fillStyle = p.color; ctx.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size);
        ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size * 0.35);
        ctx.restore();

      }
      case 'star': ctx.globalAlpha = clamp(k * 2, 0, 1); drawIcon('star', p.x, p.y, p.size * 5); break;
      case 'ring': {
        const e = easeOutCubic(1 - k);

        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size + e * p.grow, (p.size + e * p.grow) * (p.flat || 1), 0, 0, Math.PI * 2); ctx.stroke();
        break;
      }
      case 'spark':
        ctx.globalAlpha = k; ctx.strokeStyle = p.color; ctx.lineWidth = p.size * k + 1; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke();
        break;

        break;

}

// ---------- kaleler ----------
const netFx = { L: { t: 99, y: 0 }, R: { t: 99, y: 0 } };
function netHit(side, y) { netFx[side] = { t: 0, y }; }
const NEAR = { dx: -13, dy: 10 };          // öndeki kale çerçevesinin kayması (derinlik hissi)

function netMesh(side, ox, oy, alpha, lw) {
  const fx = netFx[side];
  const amp = fx.t < 3 ? 36 * Math.exp(-fx.t * 2.6) * Math.cos(fx.t * 13) : 0;
  const off = (x, y) => amp ? -amp * Math.exp(-Math.pow((y - fx.y) / 95, 2)) * (1 - x / GOAL_D) : 0;
  const top = cbY(side), bot = GROUND;
  ctx.strokeStyle = `rgba(255,255,255,${alpha})`; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = 0; x <= GOAL_D - 6; x += 17.5) {
    for (let i = 0; i <= 8; i++) { const y = top + (bot - top) * i / 8; const px = x + off(x, y) + ox, py = y + oy; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  }
  for (let y = top + 17; y < bot; y += 17.2) {
    for (let i = 0; i <= 6; i++) { const x = (GOAL_D - 4) * i / 6; const px = x + off(x, y) + ox, py = y + oy; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  }
  ctx.stroke();
}
function tube(x, y, w, h, vertical, dim = 0) {
  const g = vertical ? ctx.createLinearGradient(x, 0, x + w, 0) : ctx.createLinearGradient(0, y, 0, y + h);
  const a = dim ? '#d5dbe4' : '#ffffff', b = dim ? '#aab3c0' : '#eef1f5', cc = dim ? '#7d8795' : '#aeb7c4';
  g.addColorStop(0, b); g.addColorStop(0.3, a); g.addColorStop(1, cc);
  ctx.fillStyle = g; rrect(ctx, x, y, w, h, Math.min(w, h) / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(10,14,22,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
}
// sol kaleye göre çizilir; sağ kale aynalanır
function drawGoal(side, front) {
  ctx.save();
  if (side === 'R') { ctx.translate(W, 0); ctx.scale(-1, 1); }
  const cb = cbY(side), top = cb - CB_T, defender = game.p.find(p => p.side === side), grow = goalGrow[side].k;
  const col = defender ? defender.look.team : '#53fc18';
  if (!front) {
    // içi + arka file
    ctx.fillStyle = 'rgba(6,10,18,0.34)'; ctx.fillRect(0, cb, GOAL_D, GROUND - cb);
    if (grow > 0.02) {

      ctx.drawImage(glowSprite('#ffd23f'), -70, top - 60, GOAL_D + 150, GROUND - top + 100); ctx.restore();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(GOAL_D * 0.5, GROUND + 4, GOAL_D * 0.7, 7, 0, 0, 7); ctx.fill();
    netMesh(side, 0, 0, 0.26, 1.8);
    // arka (uzak) çerçeve: fiziksel direk ve tavan
    tube(GOAL_D - 4.5, top, 9, GROUND - top + 2, true, 1);

  } else {
    // tavan filesi (iki çerçeve arası)

    ctx.beginPath(); ctx.moveTo(-2, top + 4); ctx.lineTo(GOAL_D + 8, top + 4); ctx.lineTo(GOAL_D + 8 + NEAR.dx, top + 4 + NEAR.dy); ctx.lineTo(-2 + NEAR.dx, top + 4 + NEAR.dy); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.42)'; ctx.lineWidth = 1.8; ctx.beginPath();
    for (let x = 6; x < GOAL_D; x += 17.5) { ctx.moveTo(x, top + 4); ctx.lineTo(x + NEAR.dx, top + 4 + NEAR.dy); }
    ctx.stroke();
    // ön yan file
    netMesh(side, NEAR.dx, NEAR.dy, 0.55, 2.2);
    // ön çerçeve
    const nx = GOAL_D + NEAR.dx, ny = top + NEAR.dy;
    tube(-3 + NEAR.dx, ny, GOAL_D + 10, CB_T, false);
    tube(nx - 7, ny, 14, GROUND - top + 4, true);
    // takım rengi bant + direk dibi
    ctx.fillStyle = col; rrect(ctx, nx - 8, ny + 34, 16, 20, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(10,14,22,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(nx - 4, ny + 36, 3, 16);
    ctx.fillStyle = '#8b94a3'; rrect(ctx, nx - 11, GROUND + NEAR.dy - 5, 22, 8, 3); ctx.fill();
    // köşe bağlantısı (üst direk perspektifi)
    ctx.strokeStyle = '#f4f6f9'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(GOAL_D + 2, top + 5); ctx.lineTo(nx, ny + 6); ctx.stroke();
    ctx.strokeStyle = 'rgba(10,14,22,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(GOAL_D + 5, top + 9); ctx.lineTo(nx + 4, ny + 11); ctx.stroke();
  }
  ctx.restore();
}

// ---------- top ----------
let ballSpr = null, ballShade = null;
function bakeBall() {
  const S = 160, r = S / 2 - 4;
  ballSpr = document.createElement('canvas'); ballSpr.width = ballSpr.height = S;
  let c = ballSpr.getContext('2d'); c.translate(S / 2, S / 2);
  c.beginPath(); c.arc(0, 0, r, 0, 7); c.fillStyle = '#fbfcfd'; c.fill(); c.save(); c.clip();
  const pent = (cx, cy, rr, rot) => { c.beginPath(); for (let i = 0; i < 5; i++) { const a = rot + i * Math.PI * 2 / 5; c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } c.closePath(); c.fillStyle = '#16181d'; c.fill(); };
  pent(0, 0, r * 0.36, -Math.PI / 2);
  c.strokeStyle = '#8f98a6'; c.lineWidth = 3;
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    c.beginPath(); c.moveTo(Math.cos(a) * r * 0.36, Math.sin(a) * r * 0.36); c.lineTo(Math.cos(a) * r * 0.66, Math.sin(a) * r * 0.66); c.stroke();
    pent(Math.cos(a) * r * 0.98, Math.sin(a) * r * 0.98, r * 0.36, a + Math.PI);
    const a2 = a + Math.PI / 5;
    c.beginPath(); c.moveTo(Math.cos(a) * r * 0.66, Math.sin(a) * r * 0.66); c.lineTo(Math.cos(a2) * r * 0.8, Math.sin(a2) * r * 0.8); c.lineTo(Math.cos(a + Math.PI * 2 / 5) * r * 0.66, Math.sin(a + Math.PI * 2 / 5) * r * 0.66); c.stroke();
    c.beginPath(); c.moveTo(Math.cos(a2) * r * 0.8, Math.sin(a2) * r * 0.8); c.lineTo(Math.cos(a2) * r, Math.sin(a2) * r); c.stroke();
  }
  c.restore();
  ballShade = document.createElement('canvas'); ballShade.width = ballShade.height = S;
  c = ballShade.getContext('2d'); c.translate(S / 2, S / 2);
  const g = c.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.05, 0, 0, r);
  g.addColorStop(0, 'rgba(255,255,255,0.75)'); g.addColorStop(0.3, 'rgba(255,255,255,0.05)'); g.addColorStop(0.72, 'rgba(10,16,40,0.14)'); g.addColorStop(1, 'rgba(8,10,30,0.6)');
  c.beginPath(); c.arc(0, 0, r, 0, 7); c.fillStyle = g; c.fill();
  c.strokeStyle = 'rgba(8,10,20,0.75)'; c.lineWidth = 4; c.stroke();
}
function drawBallAt(x, y, R, rot, vx = 0, vy = 0) {
  if (!ballSpr) bakeBall();
  const sp = Math.hypot(vx, vy), st = clamp(sp / 5200, 0, 0.2), ang = Math.atan2(vy, vx);
  const k = (R * 2) / (ballSpr.width - 8);
  ctx.save(); ctx.translate(x, y);
  if (st > 0.02) { ctx.rotate(ang); ctx.scale(1 + st, 1 - st * 0.7); ctx.rotate(-ang); }
  ctx.save(); ctx.rotate(rot); ctx.scale(k, k); ctx.drawImage(ballSpr, -ballSpr.width / 2, -ballSpr.height / 2); ctx.restore();
  ctx.scale(k, k); ctx.drawImage(ballShade, -ballShade.width / 2, -ballShade.height / 2);
  ctx.restore();
}
const ballTrail = [];
function drawBall() {
  if (ball.hidden) { ballTrail.length = 0; return; }
  const { x, y } = ball, sp = Math.hypot(ball.vx, ball.vy), fire = ball.fire > 0;
  // gölge
  const shk = clamp(1 - (GROUND - y) / 520, 0.25, 1);
  ctx.fillStyle = `rgba(0,0,0,${0.3 * shk})`; ctx.beginPath(); ctx.ellipse(x, GROUND + 4, BALL_R * shk * 1.05, 6 * shk, 0, 0, 7); ctx.fill();
  // iz
  ballTrail.push({ x, y }); if (ballTrail.length > 9) ballTrail.shift();
  if (sp > 520 || fire) {
    for (let i = 0; i < ballTrail.length - 1; i++) {
      const t = ballTrail[i], k = i / ballTrail.length;
      if (fire) {
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k * 0.55;
        const s = BALL_R * (1.2 + k * 1.6); ctx.drawImage(glowSprite(i % 2 ? '#ff5a00' : '#ffb400'), t.x - s, t.y - s, s * 2, s * 2);
        ctx.globalCompositeOperation = 'source-over';
      } else {
        ctx.globalAlpha = k * 0.22 * clamp((sp - 520) / 500, 0, 1); ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(t.x, t.y, BALL_R * (0.45 + k * 0.5), 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  if (fire) {
    ctx.globalCompositeOperation = 'lighter';
    const s = BALL_R * (3.4 + Math.sin(TIME * 30) * 0.3); ctx.globalAlpha = 0.9; ctx.drawImage(glowSprite('#ff5a00'), x - s, y - s, s * 2, s * 2);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
  drawBallAt(x, y, BALL_R, ball.rot, ball.vx, ball.vy);
  if (fire) {
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55;
    const s = BALL_R * 1.5; ctx.drawImage(glowSprite('#ff8a00'), x - s, y - s, s * 2, s * 2);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
}

// ---------- oyuncu ----------
function exprOf(p) {
  if (p.frozen > 0 || p.spawning) return 'shock';
  if (p.stun > 0) return 'dizzy';
  if (p.mood === 'happy') return 'happy';
  if (p.mood === 'sad') return 'sad';
  if (p.act && p.act.type === 'dance') return 'happy';
  if (p.act && p.act.type === 'sit' && (p.sit || 0) > 0.6 && p.act.t > 2) return 'calm';
  if (p.kickT > 0 || p.fireReady || (!p.onGround && game.state === 'playing')) return 'grit';
  return 'normal';
}
function rig(p) {
  const v = p.vis || (p.vis = { sq: 0, sqV: 0, ph: 0, lean: 0, walk: 0, wasAir: !p.onGround, lastVy: 0, beam: 1 });
  const dt = FRAME_DT;
  if (v.wasAir && p.onGround) {
    v.sqV -= clamp(v.lastVy / 1500, 0.25, 1) * 5.5;
    if (v.lastVy > 520) fxDust(p.x, GROUND, 5, 180);
  }
  v.wasAir = !p.onGround; if (!p.onGround) v.lastVy = p.vy;
  const target = p.onGround ? 0 : clamp(Math.abs(p.vy) / 2600, 0, 0.11);
  v.sqV += (-(v.sq - target) * 270 - v.sqV * 15) * dt; v.sq = clamp(v.sq + v.sqV * dt, -0.3, 0.22);
  const moving = p.onGround && Math.abs(p.vx) > 40 && !p.spawning;
  v.walk += ((moving ? 1 : 0) - v.walk) * Math.min(1, dt * 10);
  if (moving) v.ph += Math.abs(p.vx) * dt * 0.034;
  const f = p.face || p.dir;
  const leanT = p.stun > 0 ? Math.sin(p.t * 18) * 0.13
    : clamp(p.vx * f / 620, -1, 1) * 0.15 + (p.onGround ? 0 : clamp(p.vy / 2400, -1, 1) * -0.07);
  v.lean += (leanT - v.lean) * Math.min(1, dt * 12);
  if (!p.spawning) v.beam = Math.max(0, v.beam - dt * 2.2);
  return v;
}
function drawSpawnBeam(p) {
  const v = p.vis; if (!v || v.beam <= 0.01) return;
  const w = 150, col = p.look.team;
  const g = ctx.createLinearGradient(p.x - w / 2, 0, p.x + w / 2, 0);
  g.addColorStop(0, rgba(col, 0)); g.addColorStop(0.5, rgba(mix(col, '#ffffff', 0.55), 0.55 * v.beam)); g.addColorStop(1, rgba(col, 0));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g; ctx.fillRect(p.x - w / 2, GROUND - 900, w, 900);
  ctx.restore();
}
function drawPlayer(p) {
  if (!p) return;
  const v = rig(p), h = p.head(), al = clamp(p.alpha, 0, 1);
  drawSpawnBeam(p);
  // hâle
  let aura = null;
  if (p.fireReady) aura = ['#ff6a00', 0.6 + Math.sin(p.t * 12) * 0.15];
  else if (p.flash > 0) aura = ['#ffe14d', p.flash * 0.85];
  else if (p.tier >= 4) aura = ['#ffd23f', 0.34 + Math.sin(p.t * 3) * 0.07];
  else if (p.tier === 3) aura = ['#ff7a1a', 0.2];
  if (aura) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = al * aura[1];
    const r = h.r * 2.4; ctx.drawImage(glowSprite(aura[0]), h.x - r, h.y - r * 0.92, r * 2, r * 2); ctx.restore();
  }
  ctx.globalAlpha = al;
  const kick = p.kickT > 0 ? Math.sin(clamp(1 - p.kickT / 0.2, 0, 1) * Math.PI) : 0;
  const sit = p.sit || 0;
  ctx.save();
  if (p.rot || sit > 0.01) {
    const py = p.rot ? p.y - 60 : p.y;
    ctx.translate(p.x, py); ctx.rotate(p.rot || 0); ctx.scale(1 + 0.07 * sit, 1 - 0.2 * sit); ctx.translate(-p.x, -py);
  }
  drawCharacter(ctx, p.x, p.y, PS, p.look, {
    facing: p.face || p.dir, headScale: p.headScale, t: p.t, kick, expr: exprOf(p), groundY: GROUND,
    lean: v.lean - sit * 0.1, sx: 1 - v.sq * 0.55, sy: 1 + v.sq,
    hop: Math.abs(Math.sin(v.ph)) * 7 * v.walk,
    bootRot: Math.sin(v.ph) * 0.3 * v.walk + (p.onGround ? 0 : clamp(p.vy / 1600, -1, 1) * 0.32) + sit * 0.2
  });
  ctx.restore();

  if (p.fireReady && Math.random() < 0.7) {
    particles.push({ x: h.x + rand(-h.r, h.r) * 0.8, y: h.y - h.r * 0.5 + rand(-10, 10), vx: rand(-20, 20), vy: -rand(80, 190), life: 0.5, max: 0.5, size: rand(9, 16), color: ['#ff3d00', '#ff9100', '#ffd54f'][Math.floor(Math.random() * 3)], g: -120, kind: 'flame' });
  }
  if (p.frozen > 0) drawIce(h, p.t);
  if (p.stun > 0) {
    for (let i = 0; i < 3; i++) {
      const a = p.t * 5.5 + i * 2.094;
      drawIcon('star', h.x + Math.cos(a) * h.r * 0.95, h.y - h.r * 1.02 + Math.sin(a) * 13, 30 + Math.sin(a) * 6);
    }
  }
  if (p.toy) drawBallAt(p.toy.x, p.toy.y, BALL_R * 0.85, p.toy.rot);
  let topY = h.y - h.r * 1.12;

function plate(cx, cy, w, h, sk, fill, edge) {

  ctx.moveTo(cx - w / 2 + sk, cy - h / 2); ctx.lineTo(cx + w / 2 + sk, cy - h / 2);
  ctx.lineTo(cx + w / 2 - sk, cy + h / 2); ctx.lineTo(cx - w / 2 - sk, cy + h / 2); ctx.closePath();
  ctx.lineJoin = 'round';
  if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = 10; ctx.stroke(); }
  ctx.fillStyle = fill; ctx.fill();
}
function teamGrad(col, x0, x1) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);

}

// ---------------- döngü ----------------
let last = now();
function loop() {
  const t = now();
  let dt = Math.min(0.05, (t - last) / 1000); last = t;
  connStatus.t += dt;
  FRAME_DT = dt; TIME += dt;
  if (slowT > 0) { slowT -= dt; dt *= 0.3; }
  const steps = 3;
  for (let i = 0; i < steps; i++) update(dt / steps);
  render();
  requestAnimationFrame(loop);
}

// ---------------- KICK BAĞLANTISI ----------------
const seen = new Map();
function dedupe(key, ms = 10000) {
  const t = Date.now();
  for (const [k, v] of seen) if (t - v > 60000) seen.delete(k);
  if (seen.has(key) && t - seen.get(key) < ms) return true;
  seen.set(key, t); return false;
}
const giftGroups = new Map();

function handleKickEvent(name, data) {
  const ev = name.replace(/^App\\Events\\/, '');
  switch (ev) {
    case 'ChatMessageEvent': {
      const u = data?.sender?.username, txt = (data?.content || '').trim();
      const badges = (data?.sender?.identity?.badges || []).map(b => b.type);
      const yetkili = (u || '').toLowerCase() === 'apocalpser' || badges.includes('broadcaster') || badges.includes('moderator');
      if (yetkili && /^!test/i.test(txt)) { chatTest(txt); break; }
      onChat(u, txt);
      break;
    }
    case 'SubscriptionEvent':
    case 'ChannelSubscriptionEvent': {
      const u = data?.username; if (!u) break;
      if (dedupe('sub:' + u.toLowerCase(), 15000)) break;
      onSub(u);
      break;
    }
    case 'GiftedSubscriptionsEvent': {
      const gifter = data?.gifter_username || 'Anonim';
      const names = Array.isArray(data?.gifted_usernames) ? data.gifted_usernames : [];
      const n = names.length || 1;
      // aynı olay iki kanaldan gelebilir; her parça yalnızca bir kez sayılır
      if (dedupe('gift:' + (data?.correlation_id || gifter) + ':' + names.join(','), 60000)) break;
      onGift(gifter, n);
      break;
    }
    case 'KicksGifted': {
      const id = data?.gift_transaction_id;
      if (id && dedupe('kicks:' + id, 60000)) break;
      onKicks(data?.sender?.username, +(data?.gift?.amount || 0));
      break;
    }
  }
}

// Yayıncı/moderatör chat'ten test eder:
// !testabone [isim]  !testhediye [sayı] [isim]  !testkicks [miktar] [isim]  !testbitir  !testsifirla
function chatTest(txt) {
  const [cmd, a, b] = txt.split(/\s+/);
  const c = cmd.toLowerCase();
  const isim = (x) => x || ('test_' + Math.floor(Math.random() * 900 + 100));
  if (c === '!testabone') TEST.sub(isim(a));
  else if (c === '!testhediye') TEST.gift(Math.max(1, parseInt(a) || 10), isim(b));
  else if (c === '!testkicks') TEST.kicks(Math.max(1, parseInt(a) || 1000), isim(b));
  else if (c === '!testbitir') { if (game.state === 'playing') game.time = 0.5; else if (game.champ) game.champ.forceLeave = true; }
  else if (c === '!testsifirla') {
    game.queue = []; game.p = []; game.champ = null; game.leavers = []; game.banner = null; pendingKicks.clear();
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
    resetBall(); setState('idle'); toast('Oyun sıfırlandı', '#ffffff', '🔄');
  }
}

function setConn(text, color) { connStatus = { text, color, t: 0 }; }

async function resolvePusherKey() {
  try {
    const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 4000);
    const r = await fetch(`https://web.kick.com/api/v1/realtime/channels/${CONFIG.channelId}/chat/connection`, {
      method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client: { id: 'kafafutbolu-' + Math.random().toString(36).slice(2), type: 'web' }, capabilities: { accepted_providers: [{ provider: 'pusher' }] } })
    });
    const j = await r.json();
    const c = (j?.data?.connections || []).find(c => c?.credentials?.app_key);
    if (c) return { key: c.credentials.app_key, cluster: c.credentials.cluster || 'us2' };
  } catch (e) { }
  return null;
}

let ws = null, retry = 0, pingTimer = null, triedFresh = false;
async function connectKick(forceFresh) {
  let key = CONFIG.pusherKey, cluster = CONFIG.pusherCluster;
  if (forceFresh) { const f = await resolvePusherKey(); if (f) { key = f.key; cluster = f.cluster; CONFIG.pusherKey = key; CONFIG.pusherCluster = cluster; } }
  setConn('Kick\'e bağlanıyor...', '#ffd23f');
  try {
    ws = new WebSocket(`wss://ws-${cluster}.pusher.com/app/${key}?protocol=7&client=js&version=8.4.0&flash=false`);
  } catch (e) { scheduleReconnect(); return; }
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    let data = msg.data;
    if (typeof data === 'string') { try { data = JSON.parse(data); } catch { } }
    if (msg.event === 'pusher:connection_established') {
      retry = 0;
      const chans = [`channel_${CONFIG.channelId}`, `channel.${CONFIG.channelId}`];
      if (CONFIG.chatroomId) chans.unshift(`chatrooms.${CONFIG.chatroomId}.v2`, `chatroom_${CONFIG.chatroomId}`);
      chans.forEach(c => ws.send(JSON.stringify({ event: 'pusher:subscribe', data: { auth: '', channel: c } })));
      setConn('Kick bağlı · sürüm ' + BUILD, '#53fc18');
      clearInterval(pingTimer);
      pingTimer = setInterval(() => { try { ws.send(JSON.stringify({ event: 'pusher:ping', data: {} })); } catch { } }, 30000);
      return;
    }
    if (msg.event === 'pusher:ping') { ws.send(JSON.stringify({ event: 'pusher:pong', data: {} })); return; }
    if (msg.event === 'pusher:error') {
      const code = data?.code;
      if (code === 4001 && !triedFresh) { triedFresh = true; setConn('Kick anahtarı değişmiş, yenisi aranıyor...', '#ff9100'); try { ws.close(); } catch { } }
      return;
    }
    if (msg.event && !msg.event.startsWith('pusher')) handleKickEvent(msg.event, data);
  };
  ws.onclose = () => { clearInterval(pingTimer); setConn('Kick bağlantısı koptu, yeniden deneniyor...', '#ff4d4d'); scheduleReconnect(); };
  ws.onerror = () => { };
}
function scheduleReconnect() {
  retry++;
  setTimeout(() => connectKick(triedFresh && retry < 4), Math.min(30000, 1000 * 2 ** Math.min(retry, 5)));
}

// ---------------- test paneli ----------------
const TEST_NAMES = ['kral_34', 'golmakinesi', 'zeynep_07', 'firtina61', 'kafakafaya', 'tribunlerin_sesi', 'berkay', 'mavi_simsek', 'apocalpser', 'deli_dana', 'sniper_kafa', 'can35'];
function rndName() { return TEST_NAMES[Math.floor(Math.random() * TEST_NAMES.length)] + (Math.random() < 0.3 ? Math.floor(Math.random() * 99) : ''); }
window.TEST = {
  sub: (u) => handleKickEvent('App\\Events\\SubscriptionEvent', { username: u || rndName(), months: 1 }),
  gift: (n, u) => handleKickEvent('GiftedSubscriptionsEvent', { gifter_username: u || rndName(), gifted_usernames: Array.from({ length: n }, (_, i) => 'x' + i + Math.random()) }),
  kicks: (n, u) => handleKickEvent('KicksGifted', { gift_transaction_id: Math.random().toString(36), sender: { username: u || rndName() }, gift: { amount: n } }),
  chat: (u, msg) => handleKickEvent('App\\Events\\ChatMessageEvent', { sender: { username: u }, content: msg }),
  cheer: (side, n = 5) => { for (let i = 0; i < n; i++) onChat('izleyici' + Math.random(), side === 2 ? '!2' : '!1'); },
  champ: () => game.champ ? game.champ.name : null,
  players: () => game.p.map(p => p.name)
};

function buildTestPanel() {
  const el = document.getElementById('test');
  el.style.display = 'flex';
  document.body.style.background = 'linear-gradient(160deg,#2a3346,#0b0e14)';
  const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { audio(); fn(); }; el.appendChild(b); };
  const inp = document.createElement('input'); inp.placeholder = 'kullanıcı adı (boş = rastgele)'; el.appendChild(inp);
  const u = () => inp.value.trim() || undefined;
  btn('⭐ Abone', () => TEST.sub(u()));
  btn('🎁 5 hediye', () => TEST.gift(5, u()));
  btn('🎁 10 hediye', () => TEST.gift(10, u()));
  btn('🎁 25 hediye', () => TEST.gift(25, u()));
  btn('🦘 !zıpla', () => { const p = game.p[0] || game.champ; if (p) TEST.chat(p.name, '!zıpla'); });
  btn('👟 !şut', () => { const p = game.p[0] || game.champ; if (p) TEST.chat(p.name, '!şut'); });
  btn('🎁 1 hediye', () => TEST.gift(1, u()));
  btn('💚 500 Kicks', () => TEST.kicks(500, u()));
  btn('💚 2500 Kicks', () => TEST.kicks(2500, u()));
  const pw = (cmd) => () => { const p = game.p.find(q => q.charges > 0) || game.p[0]; if (p) { if (p.charges <= 0) p.charges = 1; TEST.chat(p.name, cmd); } };
  btn('❄️ !dondur', pw('!dondur')); btn('🥅 !kale', pw('!kale')); btn('🔥 !alev', pw('!alev')); btn('🔻 !küçült', pw('!küçült'));
  btn('⏩ Süre bitir', () => { if (game.state === 'playing') game.time = 0.5; else if (game.champ) game.champ.forceLeave = true; });
}

// ---------------- durumu sakla (sayfa yenilense de oyuncular kaybolmasın) ----------------
const SAVE_KEY = 'kafafutbolu-durum-v1';
function saveState() {
  if (!CONFIG.persist) return;
  try {
    const ent = (p) => ({ name: p.name, support: { ...p.support }, crown: !!p.crown, tier: p.tier });
    const list = [];
    if (game.champ && !game.champ.leaving) list.push(ent(game.champ));
    for (const p of game.p) list.push(ent(p));
    for (const e of game.queue) list.push({ name: e.name, support: { ...e.support }, crown: !!e.crown, tier: e.tier });
    localStorage.setItem(SAVE_KEY, JSON.stringify({ t: Date.now(), list, pending: [...pendingKicks] }));
  } catch (e) { }
}
function restoreState() {
  if (!CONFIG.persist) return;
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!d || Date.now() - d.t > 6 * 3600 * 1000) return;
    for (const e of d.list || []) { if (e && e.name) game.queue.push({ name: e.name, support: e.support || { sub: 1, gift: 0, kicks: 0 }, crown: !!e.crown, tier: tierOfPoints(pointsOf(e.support)) }); }
    for (const [k, v] of d.pending || []) pendingKicks.set(k, v);
  } catch (e) { }
}

// ---------------- canlı güncelleme: yeni sürüm yüklenince sayfa kendini yeniler ----------------
let updPending = null;
async function checkUpdate() {
  if (!/^https?:$/.test(location.protocol) || BUILD.startsWith('__')) return;
  try {
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD) updPending = m[1];
  } catch (e) { }
}
function applyUpdateIfSafe() {
  if (!updPending || !(game.state === 'idle' || game.state === 'waiting') || (game.champ && game.champ.spawning)) return;
  saveState();
  const q = new URLSearchParams(location.search); q.set('v', updPending);
  updPending = null;
  location.replace(location.pathname + '?' + q.toString());
}

// ---------------- başlat ----------------
function fit() {
  const s = Math.min(innerWidth / CW, innerHeight / CH);
  cv.style.width = CW * s + 'px'; cv.style.height = CH * s + 'px';
}
addEventListener('resize', fit);
addEventListener('pointerdown', () => audio(), { once: true });

(async function init() {
  fit();
  try { await Promise.race([Promise.all([document.fonts.load('700 40px KF'), document.fonts.load('italic 700 40px KF')]), new Promise(r => setTimeout(r, 2500))]); } catch { }
  buildBackground();
  if (CONFIG.test) buildTestPanel();
  restoreState();
  setInterval(saveState, 2000); addEventListener('beforeunload', saveState);
  setInterval(checkUpdate, 45000); setTimeout(checkUpdate, 5000);
  setInterval(applyUpdateIfSafe, 1000);
  if (Q.get('baglanti') !== '0') connectKick(false); else setConn('Kick bağlantısı kapalı (test)', '#888');
  requestAnimationFrame(loop);
})();
